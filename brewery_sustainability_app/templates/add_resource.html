<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Add Resource Usage - Brewery Sustainability</title>
    <style>
      body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
      .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
      h1 { color: #2c3e50; text-align: center;}
      label { display: block; margin-top: 10px; font-weight: bold; }
      input[type="text"], input[type="number"], input[type="date"], select {
        width: 100%;
        padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ddd;
        box-sizing: border-box;
      }
      input[type="submit"] {
        background-color: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 4px;
        cursor: pointer; font-size: 16px; margin-top: 20px; width: 100%;
      }
      input[type="submit"]:hover { background-color: #2980b9; }
      .nav-link { display: block; margin-top: 20px; padding: 10px; background-color: #e0e0e0; text-decoration: none; color: #333; border-radius: 4px; text-align: center;}
      .nav-link:hover { background-color: #d0d0d0; }
      /* Flash message styles */
      .flashes { list-style-type: none; padding: 0; margin: 1em 0; }
      .flashes li { padding: 0.75em 1.25em; margin-bottom: 1rem; border: 1px solid transparent; border-radius: 0.25rem; }
      .flashes .success { color: #155724; background-color: #d4edda; border-color: #c3e6cb; }
      .flashes .error { color: #721c24; background-color: #f8d7da; border-color: #f5c6cb; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Add New Resource Usage</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <ul class="flashes">
          {% for category, message in messages %}
            <li class="{{ category }}">{{ message }}</li>
          {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('add_resource') }}">
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" value="{{ form_data.get('date', '') }}" required>

        <label for="resource_type">Resource Type:</label>
        <select id="resource_type" name="resource_type" required>
          <option value="">-- Select Type --</option>
          <option value="Water" {% if form_data.get('resource_type') == 'Water' %}selected{% endif %}>Water</option>
          <option value="Energy" {% if form_data.get('resource_type') == 'Energy' %}selected{% endif %}>Energy</option>
          <option value="Raw Material" {% if form_data.get('resource_type') == 'Raw Material' %}selected{% endif %}>Raw Material</option>
          <option value="Other" {% if form_data.get('resource_type') == 'Other' %}selected{% endif %}>Other</option>
        </select>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" step="any" value="{{ form_data.get('quantity', '') }}" required>

        <label for="unit">Unit:</label>
        <input type="text" id="unit" name="unit" value="{{ form_data.get('unit', '') }}" required placeholder="e.g., gallons, kWh, kg">

        <input type="submit" value="Add Usage">
      </form>
      <a href="{{ url_for('index') }}" class="nav-link">Back to Home</a>
    </div>
  </body>
</html>
