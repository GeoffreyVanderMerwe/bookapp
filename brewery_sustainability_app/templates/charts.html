<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Resource Usage Charts - Brewery Sustainability</title>
    <!-- Using Chart.js CDN from jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
      body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
      .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 900px; margin: auto; }
      h1 { color: #2c3e50; text-align: center; }
      .chart-container { width: 100%; max-width: 700px; margin: 20px auto; } /* Centered chart */
      .nav-links { margin-top: 20px; text-align: center; }
      .nav-links a {
        display: inline-block; margin: 0 10px; padding: 10px 15px; background-color: #3498db; color: white;
        text-decoration: none; border-radius: 4px;
      }
      .nav-links a:hover { background-color: #2980b9; }
      .filter-container { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9; }
      .action-button { /* For Apply button, can be reused */
        background-color: #007bff; padding: 8px 15px; color:white; border:none; border-radius:4px; cursor:pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Resource Usage Visualizations</h1>

      <div class="filter-container">
        <h3 style="margin-top:0;">Filter Chart Data</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end;">
          <div>
            <label for="chart_start_date">Start Date:</label><br>
            <input type="date" id="chart_start_date" name="chart_start_date" style="padding: 8px;">
          </div>
          <div>
            <label for="chart_end_date">End Date:</label><br>
            <input type="date" id="chart_end_date" name="chart_end_date" style="padding: 8px;">
          </div>
          <div>
            <button id="applyChartFilters" class="action-button">Apply Filters</button>
          </div>
        </div>
      </div>

      <div class="chart-container">
        <canvas id="myResourceChart"></canvas>
      </div>

      <div class="nav-links">
        <a href="{{ url_for('view_resources') }}">View All Usage Data</a>
        <a href="{{ url_for('index') }}">Back to Home</a>
      </div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const ctx = document.getElementById('myResourceChart').getContext('2d');
        let myChart; // Variable to hold the chart instance

        async function fetchDataAndRenderChart() {
            const startDate = document.getElementById('chart_start_date').value;
            const endDate = document.getElementById('chart_end_date').value;

            // Use url_for for the base API URL
            let apiUrl = "{{ url_for('resource_chart_data') }}";
            const params = new URLSearchParams();
            if (startDate) {
                params.append('start_date', startDate);
            }
            if (endDate) {
                params.append('end_date', endDate);
            }

            // Append query parameters if any
            const queryString = params.toString();
            if (queryString) {
                apiUrl += "?" + queryString;
            }

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const chartData = await response.json();

                if (chartData.error) {
                    console.error("Error fetching chart data from API:", chartData.error);
                    // Optionally, display a user-friendly error message on the page
                    // For example, by setting text content of an error div
                    return;
                }

                if (myChart) {
                    myChart.destroy(); // Destroy existing chart instance before drawing new one
                }

                myChart = new Chart(ctx, {
                    type: 'bar', // Default chart type
                    data: {
                        labels: chartData.labels,
                        datasets: chartData.datasets // Expecting datasets to be an array from API
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Total Quantity'
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Resource Type'
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                            },
                            title: {
                                display: true,
                                text: 'Total Resource Usage by Type'
                            }
                        }
                    }
                });
                console.log('Chart rendered/updated with fetched data.');
            } catch (error) {
                console.error('Error fetching or rendering chart:', error);
                // Optionally, display a user-friendly error message on the page
            }
        }

        // Initial chart render on page load
        fetchDataAndRenderChart();

        // Add event listener to the apply filters button
        document.getElementById('applyChartFilters').addEventListener('click', fetchDataAndRenderChart);
    });
</script>
    </div>
  </body>
</html>
