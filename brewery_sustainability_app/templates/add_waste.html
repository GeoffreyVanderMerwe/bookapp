<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Add Waste Entry - Brewery Sustainability</title>
    <style>
      body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
      .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
      h1 { color: #2c3e50; text-align: center;}
      label { display: block; margin-top: 10px; font-weight: bold; }
      input[type="text"], input[type="number"], input[type="date"], select, textarea {
        width: 100%;
        padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ddd;
        box-sizing: border-box;
      }
      textarea { min-height: 80px; }
      input[type="submit"] {
        background-color: #3498db; /* Blue for add */
        color: white; padding: 10px 20px; border: none; border-radius: 4px;
        cursor: pointer; font-size: 16px; margin-top: 20px; width: 100%;
      }
      input[type="submit"]:hover { background-color: #2980b9; }
      .nav-link { display: inline-block; margin-top: 20px; padding: 10px; background-color: #e0e0e0; text-decoration: none; color: #333; border-radius: 4px; margin-right: 10px;}
      .nav-link:hover { background-color: #d0d0d0; }
      .nav-container { text-align: center; }
      /* Flash message styles */
      .flashes { list-style-type: none; padding: 0; margin: 1em 0; }
      .flashes li { padding: 0.75em 1.25em; margin-bottom: 1rem; border: 1px solid transparent; border-radius: 0.25rem; }
      .flashes .success { color: #155724; background-color: #d4edda; border-color: #c3e6cb; }
      .flashes .error { color: #721c24; background-color: #f8d7da; border-color: #f5c6cb; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Add New Waste Entry</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <ul class="flashes">
          {% for category, message in messages %}
            <li class="{{ category }}">{{ message }}</li>
          {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('add_waste') }}">
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" value="{{ form_data.get('date', '') }}" required>

        <label for="waste_type">Waste Type:</label>
        <select id="waste_type" name="waste_type" required>
          <option value="">-- Select Waste Type --</option>
          <option value="Spent Grain" {% if form_data.get('waste_type') == 'Spent Grain' %}selected{% endif %}>Spent Grain</option>
          <option value="Glass" {% if form_data.get('waste_type') == 'Glass' %}selected{% endif %}>Glass</option>
          <option value="Cardboard" {% if form_data.get('waste_type') == 'Cardboard' %}selected{% endif %}>Cardboard</option>
          <option value="Plastics" {% if form_data.get('waste_type') == 'Plastics' %}selected{% endif %}>Plastics</option>
          <option value="Organic (non-grain)" {% if form_data.get('waste_type') == 'Organic (non-grain)' %}selected{% endif %}>Organic (non-grain)</option>
          <option value="Chemicals" {% if form_data.get('waste_type') == 'Chemicals' %}selected{% endif %}>Chemicals</option>
          <option value="Wastewater Sludge" {% if form_data.get('waste_type') == 'Wastewater Sludge' %}selected{% endif %}>Wastewater Sludge</option>
          <option value="Other" {% if form_data.get('waste_type') == 'Other' %}selected{% endif %}>Other</option>
        </select>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" step="any" value="{{ form_data.get('quantity', '') }}" required>

        <label for="unit">Unit:</label>
        <input type="text" id="unit" name="unit" value="{{ form_data.get('unit', '') }}" required placeholder="e.g., kg, lbs, bins, liters">

        <label for="disposal_method">Disposal Method:</label>
        <select id="disposal_method" name="disposal_method" required>
            <option value="">-- Select Disposal Method --</option>
            <option value="Recycled" {% if form_data.get('disposal_method') == 'Recycled' %}selected{% endif %}>Recycled</option>
            <option value="Composted" {% if form_data.get('disposal_method') == 'Composted' %}selected{% endif %}>Composted</option>
            <option value="Landfill" {% if form_data.get('disposal_method') == 'Landfill' %}selected{% endif %}>Landfill</option>
            <option value="Repurposed (e.g., animal feed)" {% if form_data.get('disposal_method') == "Repurposed (e.g., animal feed)" %}selected{% endif %}>Repurposed (e.g., animal feed)</option>
            <option value="Hazardous Waste Disposal" {% if form_data.get('disposal_method') == 'Hazardous Waste Disposal' %}selected{% endif %}>Hazardous Waste Disposal</option>
            <option value="Sold/Donated" {% if form_data.get('disposal_method') == 'Sold/Donated' %}selected{% endif %}>Sold/Donated</option>
            <option value="Incineration" {% if form_data.get('disposal_method') == 'Incineration' %}selected{% endif %}>Incineration</option>
            <option value="Other" {% if form_data.get('disposal_method') == 'Other' %}selected{% endif %}>Other</option>
        </select>

        <label for="notes">Notes (Optional):</label>
        <textarea id="notes" name="notes">{{ form_data.get('notes', '') }}</textarea>

        <input type="submit" value="Add Waste Entry">
      </form>
      <div class="nav-container">
        <a href="{{ url_for('index') }}" class="nav-link">Back to Home</a>
      </div>
    </div>
  </body>
</html>
